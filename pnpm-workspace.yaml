allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: false
  unrs-resolver: false
# Security patches (Dependabot / pnpm audit). These are all transitive dependencies whose upstream packages have not yet updated to a fixed version.
#
# Each is **kept within its original major version**; only the patch or minor version is bumped. Writing this as ">=fixed version" would push users on
# older major versions straight to the latest major version, which has an incompatible API — that is what pnpm audit --fix
# does, so don't use it. When the same package has multiple major versions in the tree (js-yaml has both 3.x and 4.x,
# brace-expansion has both 1.x and 5.x), list each major version separately.
#
# Remove each entry individually once upstream has caught up: remove it, then run pnpm audit; if it reports nothing, the entry is no longer needed.
overrides:
  # Included in production (via next, streamdown, gray-matter)
  mermaid: ^11.17.2
  dompurify: ^3.4.15
  # mermaid allows uuid 12~14 starting with 11.17; this remains pinned to 11.x
  uuid@11: ^11.1.1
  js-yaml@3: ^3.15.2
  browserslist: ^4.29.0
  baseline-browser-mapping: ^2.11.25
  '@babel/core': ^7.29.7
  nanoid@3: ^3.3.19
  # Used only during development / builds (eslint, shadcn dependency chain)
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  js-yaml@4: ^4.3.2
  fast-uri@3: ^3.1.8
  hono: ^4.13.8
  qs: ^6.16.0
